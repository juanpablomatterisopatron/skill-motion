<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Prueba del cursor en arco</title>
<style>html,body{margin:0;background:#10141c}canvas{display:block}</style>
</head>
<body>
<!-- Prueba mínima de cursorPro: el puntero viaja en arco por tres botones, se detiene y hace clic.
     La estela de puntos son posiciones reales de cursorPro (dibujar: false) en los segundos anteriores:
     si fuera una recta, los puntos caerían sobre la línea entre botones.
     Hoja de cuadros:  node $R/render.mjs prueba-cursor.html hoja.png --stills 0.2,0.7,1.2,1.9,2.6,3.2,3.9,4.4
     Debe estar junto a motor-promo.js. -->
<canvas id="c" width="1280" height="720"></canvas>
<script src="motor-promo.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const P = MotorPromo.crear(ctx, { W: 1280, H: 720 });
const BOTONES = [[260, 560], [700, 220], [1050, 520]];
// ruta: [t0, t1, x, y]: parte en t0 y llega en t1. Entre tramos queda quieto (pausa) y hace clic al llegar.
const RUTA = [[0.2, 1.1, BOTONES[0][0], BOTONES[0][1]], [1.8, 2.8, BOTONES[1][0], BOTONES[1][1]], [3.4, 4.3, BOTONES[2][0], BOTONES[2][1]]];
const CLICS = [1.15, 2.85, 4.35];
function seek(t) {
  ctx.fillStyle = '#10141c'; ctx.fillRect(0, 0, 1280, 720);
  BOTONES.forEach(([bx, by], i) => { ctx.fillStyle = '#1d2433'; ctx.beginPath(); ctx.roundRect(bx - 90, by - 34, 180, 68, 14); ctx.fill(); ctx.fillStyle = '#9fb0cc'; ctx.font = '600 22px system-ui'; ctx.textAlign = 'center'; ctx.fillText('Botón ' + (i + 1), bx, by + 8); });
  // línea recta entre botones (referencia, tenue) y estela real del puntero
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.setLineDash([6, 8]); ctx.beginPath(); BOTONES.forEach(([bx, by], i) => i ? ctx.lineTo(bx, by) : ctx.moveTo(bx, by)); ctx.stroke(); ctx.setLineDash([]);
  for (let u = 0.1; u < t; u += 0.04) { const p = P.cursorPro(u, RUTA, CLICS, { dibujar: false }); if (p) { ctx.fillStyle = 'rgba(255,122,26,.55)'; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 7); ctx.fill(); } }
  P.cursorPro(t, RUTA, CLICS);
}
window.VIDEO = { w: 1280, h: 720, duration: 5, fps: 30 }; window.seek = seek; seek(0);
</script>
</body>
</html>
