<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Hoja de cuadros</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>body{margin:0;background:#333;color:#eee;font:13px system-ui} img{display:block;width:100%}</style>
</head>
<body>
<!-- Hoja de cuadros para revisar la película: hoja.html?t=1,5.5,9&cols=3 dibuja esos segundos en una grilla. -->
<canvas id="c" width="1920" height="1080" hidden></canvas>
<img id="hoja" alt="Hoja de cuadros">
<script src="pelicula.js"></script>
<script>
(async () => {
 await document.fonts.load('40px Bangers'); await document.fonts.load('400 40px Fraunces'); await document.fonts.load('italic 400 40px Fraunces'); await document.fonts.load('800 40px Manrope'); await document.fonts.load('500 40px "JetBrains Mono"');
 const q = new URLSearchParams(location.search);
 const ts = (q.get('t') || '0.5,2.5,4.3,6.5,8.6,9.6,11.2,13.2,14.3,16.5,19,20.6,22,23,25.5,27.2,28.6,30.9').split(',').map(Number);
 const cols = +(q.get('cols') || 3), cw = 640, ch = 360, pad = 6;
 const peli = Pelicula.montar(document.getElementById('c'));
 const hoja = document.createElement('canvas'); hoja.width = cols * (cw + pad); hoja.height = Math.ceil(ts.length / cols) * (ch + pad);
 const g = hoja.getContext('2d');
 ts.forEach((t, i) => {
  peli.seek(t);
  const x = (i % cols) * (cw + pad), y = Math.floor(i / cols) * (ch + pad);
  g.drawImage(document.getElementById('c'), x, y, cw, ch);
  g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(x, y, 70, 26); g.fillStyle = '#fff'; g.font = '16px system-ui'; g.fillText(t.toFixed(1) + ' s', x + 8, y + 18);
 });
 document.getElementById('hoja').src = hoja.toDataURL('image/jpeg', 0.85);
 window.LISTA = true;
})();
</script>
</body>
</html>
